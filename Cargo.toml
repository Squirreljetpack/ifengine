[workspace]
members = [
    "ifengine_core",
    "ifengine",
    "egui",
    "ifengine_macros",
    "leptos",
    "story/forest",
    "story/saltwrack",
    "story/test_story",
]
resolver = "3"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]

[workspace.lints.rustdoc]

[workspace.lints.clippy]
