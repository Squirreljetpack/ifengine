[package]
name = "ifengine_core"
version = "0.1.0"
authors = ["Squirreljetpack"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
description = "Core types and runtime for the ifengine interactive fiction framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Squirreljetpack/ifengine"
readme = "README.md"
keywords = ["engine", "game", "interactive-fiction", "rust"]
categories = ["development-tools", "game-development"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
bitflags = "2.10.0"
thiserror = "2.0.17"
iddqd = "0.3.17"

# optional
inventory = "0.3"
serde = { version = "1.0.219", features = ["derive"], optional = true }
rand = { version = "0.9.2", optional = true }
const-fnv1a-hash = { version = "1.1.0", optional = true }
num2words = { version = "1.2", optional = true }

[features]
default = []
rand = ["dep:rand", "dep:const-fnv1a-hash"]
utils = ["dep:num2words"]
serde = ["dep:serde", "serde/derive"]
