[package]
    name        = "ifengine_egui"
    version     = "0.0.5"
    authors     = [ "Squirreljetpack" ]
    edition     = "2024"
    include     = [ "LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml" ]
    publish     = false
    default-run = "ifengine_egui"

[package.metadata.docs.rs]
    all-features = true
    targets      = [ "x86_64-unknown-linux-gnu", "wasm32-unknown-unknown" ]

[dependencies]
    # ifengine
    ifengine   = { path = "../ifengine" }
    forest     = { path = "../story/forest", optional = true }
    saltwrack  = { path = "../story/saltwrack", optional = true }
    test_story = { path = "../story/test_story", optional = true }

    # egui
    egui = { version = "0.36", features = [ "color-hex" ] }
    eframe = { version = "0.36", default-features = false, features = [
        "accesskit", # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
        # "default_fonts", # Embed the default egui fonts.
        "glow",    # Use the glow rendering backend. Alternative: "wgpu".
        "wayland", # To support Linux (and CI)
        "x11",     # To support older Linux distributions (restores one of the default features)
    ] }
    log = "0.4.27"

    # You only need serde if you want app persistence:
    serde = { version = "1.0", features = [ "derive" ], optional = true }

    # images
    egui_extras = { version = "0.36", default-features = false, features = [ "image" ] }
    image       = { version = "0.25", default-features = false, features = [ "png" ] }

    # egui exts
    egui_alignments = { version = "0.3.9" }
    egui-snarl      = { version = "0.12.0" }

    # utils
    easy-ext = "1.0.2"
    rand     = "0.9.2"
    phf      = { version = "0.13.1", features = [ "macros" ] }
    cfg-if   = "1.0"
emath = "0.36"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
    env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
    wasm-bindgen-futures = "0.4.50"
    web-sys = { version = "0.3.70", default-features = false, features = [
        "Window",
        "Document",
        "Element",
        # "console",
    ] } # to access the DOM (to hide the loading text)
    getrandom = { version = "0.3", features = [ "wasm_js" ] }

    # ----------------------------------------------------------------------------------------
    # Lints:

[lints]
    workspace = true

[build-dependencies]
    image       = { version = "0.25", default-features = false, features = [ "png", "jpeg", "ico" ] }
    serde       = { version = "1.0", features = [ "derive" ] }
    serde-hjson = "1.1.0"

[features]
    default   = [ "saltwrack" ]
    forest    = [ "dep:forest" ]
    saltwrack = [ "dep:saltwrack" ]
    test      = [ "dep:test_story" ]
    serde     = [
        "serde/derive",
        "egui-snarl/serde",
        "ifengine/serde",
        "forest?/serde",
        "saltwrack?/serde",
        "test_story?/serde",
        "eframe/persistence",
    ]
