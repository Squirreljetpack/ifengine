[package]
name = "test_story"
version = "0.0.5"
authors = ["Squirreljetpack"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
publish = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
ifengine = { path = "../../ifengine", features = ["macros", "rand"] }

[dev-dependencies]
bincode = "1.3"
postcard = { version = "1.0", features = ["alloc"] }

[features]
serde = ["dep:serde", "ifengine/serde"]
