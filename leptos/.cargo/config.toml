[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[alias]
"@dev" = "exec trunk serve --no-default-features --features" # saltwrack/forest

# "@deploy-only" = "exec npx wrangler pages deploy dist --project-name ifengine --branch main"
# "@build" = "exec trunk build --release --filehash true"

"@saltwrack" = ["exec", "-s", "trunk build --release --filehash true && npx wrangler pages deploy dist --project-name ifengine --branch main"]
"@test" = ["exec", "-s", "trunk build --release --filehash true --no-default-features --features test && npx wrangler pages deploy dist --project-name ifengine --branch=test --commit-dirty=true"]
"@chant" = ["exec", "-s", "trunk build --release --filehash true --no-default-features --features chant && npx wrangler pages deploy dist --project-name ifengine --branch=chant --commit-dirty=true"]