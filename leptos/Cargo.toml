[package]
name = "ifengine_leptos"
version = "0.0.5"
authors = ["Squirreljetpack"]
edition = "2024"
publish = false

[dependencies]
ifengine = { path = "../ifengine", features = ["serde"] }
forest = { path = "../story/forest", optional = true, features = ["serde"] }
saltwrack = { path = "../story/saltwrack", optional = true, features = ["serde"] }
test_story = { path = "../story/test_story", optional = true, features = ["serde"] }
leptos = { version = "0.8", features = ["csr"] }
cfg-if = "1.0"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
base64 = "0.22"
web-sys = { version = "0.3.70", default-features = false, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "ScrollToOptions",
    "ScrollBehavior",
    "Storage",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["saltwrack"]
saltwrack = ["dep:saltwrack"]
forest = ["dep:forest"]
test = ["dep:test_story"]

[lints]
workspace = true
