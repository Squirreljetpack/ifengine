[package]
name = "ifengine_leptos"
version = "0.0.5"
authors = ["Squirreljetpack"]
edition = "2024"
publish = false

[dependencies]
ifengine = { path = "../ifengine" }
story = { path = "../story", default-features = false }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3.70", default-features = false, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "ScrollToOptions",
    "ScrollBehavior",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["saltwrack"]
saltwrack = ["story/saltwrack"]
test = ["story/test"]

[lints]
workspace = true
